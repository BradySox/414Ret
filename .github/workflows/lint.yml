name: Python lint

on: workflow_call

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to requirements.txt rather than psf/black@stable: a floating
      # action version reformats on Black's release schedule, not ours.
      - name: Install Black
        run: python -m pip install "$(grep '^black==' requirements.txt)"
      - name: Black
        run: black --check .

  stale-docs:
    name: Published docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only, so no install step. Exit 1 = a published page still briefs a
      # removed feature; exit 2 = a row in the audit's own table is inert and has
      # been checking nothing (three were, until 2026-09-07).
      - name: Audit published docs for removed features
        run: python tools/audit_stale_docs.py

  mypy:
    name: Type checking
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: mypy
        uses: ./.github/actions/mypy
