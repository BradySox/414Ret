name: RetLab Latest Build

# Publishes a rolling "latest" pre-release on every push to main so squadron
# members always have a direct download link without needing a GitHub login or
# digging through the Actions tab.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    # Job-level permissions grant the reusable workflow's Codecov OIDC upload
    # (see test.yml) and override the workflow-level contents: write for this
    # job only — the release job below keeps its write grant.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      id-token: write

  build:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Enough history for the rolling changelog in the release notes (the
          # default shallow checkout only has the tip commit).
          fetch-depth: 50

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: Set up JS environment
        uses: ./.github/actions/setup-liberation-js

      - name: Stamp build number and SHA
        run: |
          [IO.File]::WriteAllLines($pwd.path + "\resources\buildnumber", $env:GITHUB_RUN_NUMBER)
          [IO.File]::WriteAllLines($pwd.path + "\resources\gitsha", $env:GITHUB_SHA)

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Create zip
        run: |
          Compress-Archive -Path .\dist\dcs-retribution\ -DestinationPath dist\retlab-latest.zip -Compression Optimal

      # Build the release notes fresh each push so the "Recent changes" list rolls
      # forward with main. Written to a file and passed via body_path (avoids
      # PowerShell here-string backtick/escape headaches with markdown).
      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "**Automated build** from commit ${GITHUB_SHA} on \`main\`."
            echo ""
            echo "**Download** \`retlab-latest.zip\`, extract, and run \`retribution_main.exe\`."
            echo ""
            echo "RetLab — a development fork of DCS Retribution, the turn-based"
            echo "dynamic campaign generator, plus RetLab's recon, electronic-warfare,"
            echo "air-defense, frontline, and assets features layered on top of upstream."
            echo ""
            echo "**Highlights**"
            echo "- **Fog of war** — an enemy site's composition stays hidden until you engage it, and is then known completely and permanently. Recon finds the enemy command posts, which are hidden from the map outright. A **Reveal fog of war** toggle in the map layers panel shows the real picture on demand."
            echo "- **Air defense** — Skynet drives the IADS, a QRA intercept reserve scrambles alert fighters against a raid, and every nation on the map stands its own border batteries and hails you before it fires."
            echo "- **Electronic warfare** — the JAMMING flight type flies the C-130J as an EC-130H/RC-130H EW + ISR platform; EA-18G and EA-6B escort jamming; GPS jamming that sends satellite-guided weapons long."
            echo "- **Ground war** — a front line that follows the supply lines, costs more to attack than to defend, and bulges where the fighting is, plus TIC frontline firefights with stance-based movement and ambient fire."
            echo "- **Your flying, recorded** — per-flight sortie records feed a campaign SITREP, a per-pilot logbook, and a lifetime profile that survives starting a new campaign."
            echo "- **Rescue** — a player-flown C-130J King finds the survivor by DF cuts on the beacon and passes the picture to a Sandy escort and the helicopter crew."
            echo "- **Assets** — CurrentHill Iran pack ([CH] Iran 2020 faction, Shahed-136, IRGCN FAC)."
            echo "- Plus native DTC cartridges, curated carrier comms, custom victory conditions, and a Vietnam mode with Arc Light, naval gunfire support, Super Gaggle and snake-and-nape."
            echo ""
            echo "### Recent changes"
            git log -n 15 --no-merges --pretty=format:'- %s (%h)'
            echo ""
            echo ""
            echo "> Built: ${GITHUB_RUN_NUMBER} — ${GITHUB_SHA}"
          } > release_body.md

      - name: Update latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RetLab Latest Build"
          prerelease: true
          body_path: release_body.md
          files: dist/retlab-latest.zip
