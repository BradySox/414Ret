[pytest]
# `docs` carries carve payloads for other forks (docs/dev/upstreaming/) whose
# test files are copies targeting THAT fork's tree, not ours — one imports a
# module we do not have. CI names its four test roots explicitly and never sees
# them, but a bare `pytest` from the repo root would collect and fail on them.
# The rest of the list is pytest's own default, which setting this key replaces.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} docs

markers =
    fuzztest: marks tests as fuzz tests

# Disable fuzz tests by default. They're randomized so flaky by nature. They
# are typically run manually after making changes to fuzzed code to generate
# new regression tests.
addopts =
    -m "not fuzztest"
