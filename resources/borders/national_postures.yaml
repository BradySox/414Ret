    toward_us_led:
      - { from: "1991-08", to: "1994-05", posture: closed }
      - { from: "1994-05", to: "2001-09", posture: contested }  # PfP; the Section 907 aid ban
      - { from: "2001-09", to: "present", posture: permissive } # blanket OEF overflight
    toward_ru_led:
      - { from: "1991-08", to: "1999-04", posture: permissive } # CIS collective security, not renewed
      - { from: "1999-04", to: "present", posture: contested }

  Bahrain:
