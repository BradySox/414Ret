# §96 national postures: dated overflight/alignment posture per country per bloc.
#
# Sources, reasoning and the open questions: docs/dev/design/414th-national-postures-notes.md.
# DRAFT — nothing reads this file yet. The wiring is its own change.
#
# Buckets, in order of consent. The test is overflight, not sympathy: would this
# nation let this bloc's military aircraft transit for the war being fought?
#   allied     treaty ally or basing host; transit and basing presumed
#   permissive grants transit without alliance
#   contested  sometimes tolerated, sometimes denied; event-dependent
#   closed     refuses transit and defends its airspace, but is not a belligerent
#   hostile    an active belligerent, or in a state of war, with that bloc
#
# Ranges are [from, to). All dates are quoted strings: "YYYY" or "YYYY-MM", or
# "present". Quoting keeps a bare year an int and a YYYY-MM a YAML timestamp from
# landing in the same field as two different types.
#
# A date covered by no range is `closed`. That is the safe default for a border
# feature and it is never filled in by guessing: no source, no range.
#
# Countries that did not exist yet have no ranges before independence; the
# territory belongs to the predecessor, which has its own entry (USSR, GDR).
#
# `aircraft` is optional and secondary — the alert type a §96 flight should fly.
# Vanilla pydcs ids only (hard fork constraint: no mods). Omitted where no
# vanilla type matches a real operator; the engine has a fallback.
#
# A comment marks every country DCS does not model. Those can only ever be drawn
# or permitted — a zone that spawns nothing needs no pydcs country.

countries:

  Afghanistan:
    toward_us_led:
      - { from: "1955", to: "1978-04", posture: contested }   # non-aligned, Soviet-equipped
      - { from: "1978-04", to: "2001-10", posture: closed }   # Saur Revolution
      - { from: "2001-10", to: "2001-12", posture: hostile }  # OEF against the Taliban government
      - { from: "2001-12", to: "2021-08", posture: allied }   # Bonn Agreement; Bagram and Kandahar
      - { from: "2021-08", to: "present", posture: closed }
    toward_ru_led:
      - { from: "1955-12", to: "1978-04", posture: permissive } # Bulganin visit; Soviet-built fields
      - { from: "1978-04", to: "1992-04", posture: allied }     # DRA; Soviet forces from Dec 1979
      - { from: "1992-04", to: "2001-11", posture: contested }
      - { from: "2001-11", to: "2021-08", posture: closed }
      - { from: "2021-08", to: "present", posture: contested }
    aircraft:
      - { from: "1978", to: "2001", id: MiG-21Bis }

  Argentina:
    toward_us_led:
      - { from: "1955", to: "1982-04", posture: contested }
      - { from: "1982-04", to: "1982-06", posture: hostile }    # Falklands; the US backed the UK from 30 Apr
      - { from: "1982-06", to: "1998-01", posture: contested }
      - { from: "1998-01", to: "present", posture: permissive } # Major Non-NATO Ally, Jan 1998
    toward_ru_led:
      - { from: "1955", to: "present", posture: closed }

  Armenia:
    # Not a pydcs country — drawable and permittable, never a defender.
    toward_us_led:
      - { from: "1991-09", to: "1994-10", posture: closed }
      - { from: "1994-10", to: "present", posture: contested }  # PfP, but Russian forces in country
    toward_ru_led:
      - { from: "1991-09", to: "2024-02", posture: allied }     # CSTO; 102nd Base at Gyumri, treaty to 2044
      - { from: "2024-02", to: "present", posture: contested }  # CSTO participation frozen

  Austria:
    # Permanent neutrality, Neutrality Act 26 Oct 1955. Closed to both, always.
    # It has granted UN-mandated exceptions (1991) and refused non-mandated ones
    # (2003) — case by case, which is what `closed` means here.
    toward_us_led:
      - { from: "1955-10", to: "present", posture: closed }
    toward_ru_led:
      - { from: "1955-10", to: "present", posture: closed }
    aircraft:
      - { from: "2004", to: "2008", id: F-5E-3 }               # leased from Switzerland

  Azerbaijan:
