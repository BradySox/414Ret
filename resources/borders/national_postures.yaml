      - { from: "1972-02", to: "present", posture: closed }     # Nixon's visit
    toward_ru_led:
      - { from: "1955", to: "1960-07", posture: allied }        # 1950 Treaty; advisers withdrawn Jul 1960
      - { from: "1960-07", to: "1969-03", posture: contested }
      - { from: "1969-03", to: "1969-09", posture: hostile }    # the Zhenbao / Ussuri border war
      - { from: "1969-09", to: "1989-05", posture: closed }
      - { from: "1989-05", to: "2001-07", posture: contested }
      - { from: "2001-07", to: "present", posture: permissive } # Treaty of Good-Neighbourliness; SCO
    aircraft:
