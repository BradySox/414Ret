  # aimpoint -- standing off does not help, because the weapon flies through the bubble
  # whatever range it was released from. Change delivery (laser/TV are untouched) or kill the
  # jammer, which restores accuracy at once. Runs via the 'GPS jamming' LUA plugin, preseeded
  # below -- the setting does NOTHING without it.
  gps_jamming: true
