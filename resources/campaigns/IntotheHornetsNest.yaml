# QABR AS SITT
#  29:
# --- §86 GPS jamming: two jamming sites, pinned onto existing EWR markers.
#     A standalone `GPS Jamming Site` deliberately, NOT a jamming-equipped SAM battery: it adds
#     no SAM coverage, so it changes this campaign's air-defence balance as little as a jamming
#     site can. The marker still generates a radar site (the ST-68U emits, so it stays on RWR
#     and HARM-able and still feeds the IADS) -- it just also denies GPS within 15 nm.
#     Two sites, the most widely separated free RED-owned EWR markers, so the bubbles cannot
#     overlap (effects do not stack, so overlap would buy redundancy rather than depth).
#     RED-owned matters: the override gate checks the units against the OWNING control
#     point's faction, so a marker that binds to a blue CP is silently discarded and an
#     ordinary EWR generates there instead.
#     A modern Russian peer laydown; the EW company sits with the SAM belt.
