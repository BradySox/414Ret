---
name: Syria - Anatolian Reach
theater: Syria
authors: 414th Joint Fighter Group
recommended_player_faction: USA-Israel 2000
description:
  <p>In 2004 a rupture between Ankara and Washington ends with Turkish airspace
  and Incirlik closed to coalition traffic. Moscow moves into the gap. An
  air-defence protocol puts Russian long-range SAM regiments on the Anatolian
  plateau and Russian squadrons at Diyarbakir within the year. Damascus, a
  client of Moscow since the Soviet era and isolated since the occupation of
  Lebanon began to draw sanction, signs on as the third partner. The combined
  network now reaches from the Black Sea coast to the Golan.</p><p>Israel
  cannot reach Anatolia without help. Every target that matters sits between
  250 and 400 nautical miles from the Negev, and the direct routes run through
  the Syrian corridor. A US tanker and control package operating from Akrotiri,
  and a carrier in the eastern Mediterranean, are what turn Israeli strike
  squadrons into a force that can hold Turkish airfields at risk.</p><p>The
  fight is in Turkey. Getting there is the campaign.</p>

# Retribution allows one faction per coalition, so an alliance has to be written
# inline. This follows Fuzzle's shipped Operation Allied Sword, which does the
# same thing on this map with its "Syria-Lebanon 2005 ... with several imported
# Russian assets" faction.
#
# Gated to 2004: no S-400 (SA-21, service 2007), no Buk-M2 (SA-17, 2008), no
# Su-34 (2014), no T-72B3 (2011). restrict_weapons_by_date gates WEAPONS but
# never SAM presets, so the period filtering here is manual and deliberate.
