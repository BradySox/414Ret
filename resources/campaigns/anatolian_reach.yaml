miz: anatolian_reach.miz
performance: 3
recommended_start_date: 2004-06-01
version: "10.9"

# The .miz carries comms towers, power sources and command centres, so the
# network is wired in range mode (comms <=15 nm, power <=35 nm) rather than by
# an explicit iads_config. This is what makes §51 comms jamming, §52
# decapitation and the bombed-power-station rule mean anything here -- worth
# having in a campaign whose whole shape is SEAD and deep strike.
advanced_iads: true

settings:
  squadron_start_full: true
  # 2004 loadouts. Without this the Israeli jets carry weapons that postdate the
  # scenario by a decade and the long-range problem solves itself.
  restrict_weapons_by_date: true
  restrict_props_by_date: true
  # Default true, preseeded because a host's saved settings layer UNDER campaign
  # preseeds: a Default.zip with these off silently strips the tankers this
  # campaign is built around.
  autoplan_tankers_for_strike: true
  autoplan_tankers_for_oca: true
  autoplan_tankers_for_dead: true

# The .miz places a CVN-71. The loader only recognises the Stennis hull as a
# carrier, so the group must be a CVN-74 in the editor; this block paints it
# back to a Roosevelt in game.
carriers:
  Naval-1:
    preferred_name: CVN-71 Theodore Roosevelt
    preferred_type: CVN-71 Theodore Roosevelt

squadrons:
  # ---------------------------------------------------------------- BLUE ----
  # Hatzerim (191 stands) - the deep-strike home. Farthest Israeli field from
  # Turkey at 326-484 nm, which is the point rather than a problem.
  81:
    - primary: Strike
      secondary: air-to-ground
      aircraft:
        - F-15E Strike Eagle (Suite 4+)
      size: 12
    - primary: DEAD
      secondary: air-to-ground
      aircraft:
        - F-16CM Fighting Falcon (Block 50)
      size: 12
    - primary: Escort
      secondary: air-to-air
      aircraft:
        - F-15C Eagle
      size: 12

  # Ramat David (86 stands) - forward staging, 254 nm to the nearest Turkish
  # field and 62 nm off the Syrian corridor. Recovery field for deep packages.
  30:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - F-15C Eagle
      size: 12
    - primary: SEAD
      secondary: air-to-ground
      aircraft:
        - F-16CM Fighting Falcon (Block 50)
      size: 12
    - primary: OCA/Runway
      secondary: air-to-ground
      aircraft:
        - F-15E Strike Eagle (Suite 4+)
      size: 8

  # Akrotiri (45 stands) - SUPPORT ONLY. Deliberately no strike and no fighters.
