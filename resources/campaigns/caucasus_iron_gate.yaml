---
name: Caucasus - Iron Gate
theater: Caucasus
authors: Plob, 414th Joint Fighter Group
description: "<p>June 2018. Russian armour came through the eastern mountains and took Tbilisi. The Likhi range is the gate between the half of Georgia they hold and the half you still do, and the Rikoti pass is the hinge it turns on. Take it back.</p><p>You fly from three places and none of them is comfortable. <b>Kutaisi</b> is the closest field to the fighting and holds the Warthogs, the Kiowas, the Hueys and the Hercules — the aircraft that have to be near the front to be worth anything. The fast jets sit back at <b>Batumi</b> on the Turkish border, ten stands for three squadrons, so every Eagle and Viper on the ground is one not over the pass. The tankers and the AWACS never land at all; they come out of Turkish airspace and go home there.</p><p>The rest is at sea: a Tomcat and Hornet air wing off the boat. The Apaches and Chinooks are ashore at Kutaisi with the rest of the rotary wing, which is as far forward as they get.</p><p>Red is the modern VKS — Flankers, Fulcrums, Foxhounds, Frogfoots and a Bear across five fields under an S-300 belt. They outnumber you on the ground and they know where your two runways are.</p><p>Built by the 414th from Plob's <i>Northern Russia</i>, which is still shipped unchanged.</p>"
recommended_player_faction: Bluefor Modern
recommended_enemy_faction: Russia 2020
recommended_start_date: 2018-06-13
miz: caucasus_iron_gate.miz
performance: 2
version: "10.5"
settings:
  squadron_start_full: true

# Kutaisi <-> Khashuri FOB overrides the miz path group `Ground-4`, which reached the
# Likhi range in one 41 km straight leg across the ridge and put its own waypoint on
# ground vehicles cannot cross. The front line is placed by distance along this
# polyline, so it landed on the ridge rather than in the pass. These waypoints follow
# the E60/S1 -- the Rioni valley through Terjola and Zestafoni, then the Chkherimela
# valley and the Rikoti pass down to Surami. Every waypoint is inside the landmap's
# drivable zone and 98% of the drawn line is (was 75%); over 15 sampled front
# positions all 15 now sit on drivable ground, against 10 before.
supply_routes:
  - waypoints:
