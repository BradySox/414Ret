# 414th (§86): the BLUE mirror of GPS-Jamming-Site-Red.
#
# §86 is symmetric in code -- a site denies GPS to the OPPOSING coalition -- so
# this exists for the day a blue faction fields a jammer (and so that a red
# campaign can be mirrored without new engineering). See the red preset for why
# the jammer is paired with an early-warning radar rather than standing alone.
name: GPS Jamming Site (Blue)
tasks:
  - EarlyWarningRadar
units:
  - EWR AN/FPS-117 Radar
  - EWR AN/FPS-117 Radar (domed)
  # The ARM-able emitter (see the red preset): the FPS-117 has no
  # RADAR_BAND*_FOR_ARM attributes, the NASAMS MPQ-64F1 does.
  - SAM NASAMS SR MPQ64F1
  - EW Radio Jammer (Blue)
layouts:
  - Early-Warning Radar
