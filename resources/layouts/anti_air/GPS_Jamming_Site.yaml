# 414th (§86) -- a standalone GPS jamming site.
#
# A first-class placeable site, not a modifier on some other layout: author an
# air-defence marker wherever the jamming should bite (beside a SAM belt, on an
# objective, guarding a bridge) and pin one of the `GPS Jamming Site (Red)` /
# `(Blue)` presets to it in the campaign's `ground_forces` block. Nothing else in
# the theater changes -- no existing layout is touched, and a campaign that does
# not pin the preset never sees one.
#
# WHY IT CARRIES A RADAR. A GPS jammer emits in L-band, which no RWR covers and
# no HARM homes on, so a jammer standing alone would be invisible to the tools a
# pilot hunts emitters with -- findable only by recon, never prosecutable by
# SEAD. Being on the RWR and being HARM-able are also two DIFFERENT DCS
# attributes, and no one unit here has both:
#
#   * `GT.WS.radar_type` puts a unit on the RWR.
#   * `RADAR_BAND1/2_FOR_ARM` is what an anti-radiation seeker homes on -- and
#     the EWRs do NOT carry it (verified: `EWR_FPS-117` declares only "EWR"; of
#     the units in DCS's TechWeaponPack carrying the ARM bands, not one is an
#     EWR).
#
# The acquisition radars carry both, so the site fields one: ST-68U "Tin Shield"
# (red) / NASAMS MPQ-64F1 (blue). That is what makes this a real SEAD target
# instead of a coordinate you have to go and bomb by hand.
#
# TASK. EarlyWarningRadar, because `IadsRole.for_task` maps it to `EWR` -- the
# ONE air-defence role MANTIS never holds dark under EMCON. A site tasked
# MERAD/LORAD/SHORAD would be held dark until cued, so it would be off the RWR
# and un-HARM-able most of the mission, which is exactly the thing this layout
# exists to avoid. The site therefore also contributes to its side's IADS
# detection, which is a fair price and reads correctly (it IS a radar site).
#
# NOT generic: this layout is only ever used through its presets, so it can never
# be rolled at an ordinary air-defence marker by accident.
name: GPS Jamming Site
generic: false
tasks:
  - EarlyWarningRadar
groups:
  - GPS Jamming Site:
    # The jamming section. unit_count [1, 2] so a site is one or two emitters --
    # the runtime tracks each jammer's liveness PER UNIT, so killing the trucks
    # is what stops the jamming, not killing the site.
    - name: GPS Jammer
      unit_count:
        - 1
        - 2
      unit_types:
        - GPS_Spoofer_Red
        - GPS_Spoofer_Blue
    # The ARM-able emitter (see above). unit_count 2, not 1: the ST-68U is a
    # track-radar class, so the standing §60 redundancy contract applies -- one
    # HARM must not blind the site outright, and two emitters make the SEAD fight
    # here less one-and-done.
    - name: GPS Jammer Radar
      unit_count:
        - 2
      unit_types:
        - RLS_19J6
        - NASAMS_Radar_MPQ64F1
    # Point defence, so the site is not a free pass for anything that wanders
    # overhead. Optional: a faction with no SHORAD simply fields none.
    - name: GPS Jammer Security
      optional: true
      sub_task: PointDefense
      unit_count:
        - 1
      unit_classes:
        - SHORAD
        - AAA
