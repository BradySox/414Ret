  Air Assault: 40
  Transport: 140
  Jamming: 140
  # The "King" CSAR role, kept as a deliberate 414th override (2026-08-07 squadron call).
  #
  # Upstream derives CSAR capability from the airframe and restricts it to HELICOPTERS with a
  # positive cabin size, on the grounds that the DCS AI `Land` task is helicopter-only, so a
  # fixed-wing rescuer just orbits the survivor forever. An explicit `CSAR:` entry always wins
  # over that derivation (game/dcs/aircrafttype.py, get_task_priorities), which is the supported
  # lever and is what this line is.
  #
  # KNOWN LIMIT, accepted: an AI-crewed King will NOT complete a pickup for the reason above.
  # The King is flown by a player, as the on-scene commander it always was. Do not "fix" this by
  # relaxing upstream's helicopter rule -- fix it here, on this aircraft, or not at all.
  #
  # PRIORITY 5 IS DELIBERATE AND MUST STAY THE LOWEST CSAR NUMBER IN THE FLEET (squadron call
  # 2026-08-07). The auto-planner picks the rescue airframe by task priority, so any value above
  # a helo's lets it frag a King for a rescue no AI can finish -- the pickup silently never
  # happens, with no error anywhere.
  #
  # The floor is LOWER than the 414th's own eight rescue yamls suggest: upstream derives CSAR
  # from the airframe, so 27 airframes are capable, and the cheapest is the Mi-24V at 10 (the
  # Hind is a gunship with a small cabin, so its derived number is low). 5 clears all of them.
  # tests/test_csar_king_priority.py pins this against the LIVE fleet, so adding a mod helo with
  # a low number fails CI rather than silently outranking the King. If you ever raise this
  # number, you are re-opening a bug that was closed on purpose.
  #
  # This is the only C-130 now (the stock AI model was retired). The EW/ISR (Jamming) plugin
  # claims every C-130J-30 by airframe, so the generator adds a King/SOF C-130J to the per-group
  # EW deny-list (_ew_excluded_c130j_groups -> dcsRetribution.EwExcludedGroups; see luagenerator)
  # so only that aircraft is skipped.
  CSAR: 5