description:
  The F-22A is an American single-seat, twin-engine, all-weather stealth
  tactical fighter aircraft developed exclusively for the United States Air Force
  (USAF). The result of the USAF's Advanced Tactical Fighter (ATF) program, the aircraft
  was designed primarily as an air superiority fighter, but also has ground attack,
  electronic warfare, and signal intelligence capabilities. Currently it is viewed
  as the most advanced fighter in the world.
introduced: 2005
manufacturer: Lockheed Martin
origin: USA
price: 40
role: Stealth Air-Superiority Fighter
variants:
  F-22A Raptor: {}
radios:
  # Was SCR-522 (the P-51's set) with a comment doubting it. The doubt was
  # right about the name and wrong about the band: the Grinnelli mod's
  # F-22A.lua models a plain editable VHF radio (HumanRadio, 100.000-156.000
  # MHz AM), which is exactly the SCR-522's range, so the placeholder happened
  # to allocate tunable frequencies. An AN/ARC-210 would not - its first range
  # is 225-400 MHz and that is what the allocator draws from, so a player F-22A
  # would be assigned an intra-flight channel the cockpit cannot tune.
  # Repointed to a correctly-named entry covering the band the mod actually has.
  intra_flight: F-22A VHF
  inter_flight: F-22A VHF
tasks:
  BARCAP: 550
  Escort: 550
  Fighter sweep: 550
  TARCAP: 550

# Air-to-air refueling method (receiver).
air_refuel_type: boom

# Without this the airframe falls back to the 150 NM default -- less than half the
# F-15C's authored 400 NM, which is backwards for a fighter whose internal-fuel combat
# radius exceeds the Eagle's. 450 keeps it in step with the rest of the fleet's
# (deliberately conservative) values: F-15C 400, F-16C 350.
max_range: 450

# Era gate for the DCS EPLRS (datalink) task. Sourcing and the permissive-when-absent
# rule: docs/dev/design/414th-datalink-era-notes.md
datalink_introduced: 2005
