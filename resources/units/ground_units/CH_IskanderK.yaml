class: Missile
description: "The Iskander-K is the cruise-missile variant of the Russian 9K720 Iskander system
  (NATO reporting name SSC-7/SSC-8). Where the Iskander-M launches a short-range ballistic missile on a
  high, fast trajectory, the K fires ground-launched cruise missiles that fly low and manoeuvre to the
  target, so it threatens fixed targets from standoff on a profile that ballistic-missile defences are not
  posed to intercept. It shares the M's transporter erector launcher and battery organisation."
introduced: 2006
manufacturer: Votkinsk Plant State Production Association
origin: Russia
