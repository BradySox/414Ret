class: ElectronicWarfare
description: Ground-based radio/navigation jammer. DCS lists it as a Radio jammer with
  a 50 km detection range. Retribution drives the GPS-denial effect itself (§86)
  rather than relying on that unverified in-sim behaviour - the `gps_jamming` block
  below makes this unit deny satellite guidance out to its own declared 50 km, so
  a JDAM/JSOW/JASSM released inside that bubble lands off the aimpoint. Killing it
  restores accuracy immediately.
introduced: 2010
origin: Multinational
price: 8
role: Ground Radio / Navigation Jammer
# §86 GPS jamming. The reach is the unit's OWN declared detection_range (50 km =
# 27 nm), not an invented number, so the threat bubble matches what DCS says this
# vehicle can hear. miss_radius_m is left unset, so it rides the campaign setting.
gps_jamming:
  radius_nm: 27
variants:
  "EW Radio Jammer (Blue)": null
