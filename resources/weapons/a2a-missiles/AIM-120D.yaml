# AIM-120D (AMRAAM-D). Registered so the modern AMRAAM the F-22A and CJS Super
# Hornet packs ship is date-gated and has a fallback like every other missile --
# an unregistered clsid gets introduction_year=None, which `Weapon.available_on`
# treats as "always available" with no downgrade path.
#
# `year` is 2019 rather than the real 2015 IOC on purpose: this fork dates the
# whole AIM-120C family (C-5/C-7/C-8) at 2018, so 2019 keeps the fallback ladder
# monotonic -- a weapon must never be available EARLIER than the one it falls
# back to. Retune both together if the C group is ever split by variant.
name: AIM-120D
year: 2019
fallback: AIM-120C
clsids:
  - "{AIM-120D-3}"   # AIM-120D3 - Active Radar AAM
  - "{AIM-120D}"   # AIM-120D
  - "{AIM_120D-3_IRST_LEFT}"   # AIM-120D3 - Active Radar AAM + IRST POD
  - "{AIM_120D-3_IRST_RIGHT}"   # AIM-120D3 - Active Radar AAM + IRST POD
  - "{LAU_115_2xAIM-120D-3}"   # 2x AIM-120D3 - Active Radar AAM
  - "{SUPERHORNET_PYLON_02_MB_AM_MOD_1X_AIM-120D_AI}"   # [ STA 03 | SUU79 | LAU127 ] - 1x AIM-120D AMRAAM - Active Radar AAM, (AI Only)
  - "{SUPERHORNET_PYLON_02_MB_AM_MOD_1X_AIM-120D}"   # [ STA 03 | SUU79 | LAU127 ] - 1x AIM-120D AMRAAM - Active Radar AAM, (Modern Missiles Mod Required)
