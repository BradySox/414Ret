# Mako multi-mission hypersonic missile, shipped by the F-22A pack, which types it
# as an active-radar AAM ({MAKO_A2A_C}).
#
# NOT IN ANY SHIPPED FIT, ON PURPOSE (DM call 2026-08-03): AIM-260A is blue's
# top-end air-to-air missile in this fork. The pack's own payloads put 2x Mako in
# all six of the Raptor's "Retribution ..." fits; those two stations now carry
# AIM-260A instead (pylon-legal on stations 5 and 7 -- see the pack's Pylon5 /
# Pylon7 classes), so nothing Retribution plans ever frags a hypersonic.
#
# It stays REGISTERED rather than deleted because deleting it is not neutral: an
# unregistered clsid falls through `WeaponGroup.register_unknown_weapons`, which
# sets introduction_year=None, and `Weapon.available_on` reads that as "available
# in every era with no fallback". Since the store is still selectable in the
# payload editor, dropping this file would put an ungated hypersonic back in a
# 2006 campaign the moment anyone hand-loaded it. Registered, it is gated like
# everything else.
#
# `year` is 2027: Mako was unveiled in 2024 as a company-funded design and has no
# IOC to cite, so this sits AFTER AIM-260A (2026) as the less mature of the two,
# which keeps the ladder monotonic. The date is now only reachable by a deliberate
# hand-load in a 2027+ campaign; if the fork ever wants AIM-260A to be an absolute
# ceiling that even a hand-load cannot beat, park this year past every shipped
# campaign instead of deleting the file.
name: Mako
year: 2027
fallback: AIM-260A
clsids:
  - "{MAKO_A2A_C}"   # Mako Multi-Mission Hypersonic Missile - Active Radar AAM
