  # The CJS Super Hornet pack's own TALD stores. Registered because the fork's
  # FA-18E/F SEAD fits now frag these instead of the stock BRU_42A ones: the mod
  # inherits ED's entries into its pylon table, so a stock store is can_equip-legal
  # on the mod jet without being mountable on the mod's geometry, and DCS silently
  # drops it -- the pylon spawns empty. Unregistered they would fall through
  # `register_unknown_weapons` to introduction_year=None, i.e. "available in every
  # era with no fallback" (the same hole #771 closed for the modern AMRAAMs).
