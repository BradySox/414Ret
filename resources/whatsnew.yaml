# What's New — the recent player-visible changes, newest first.
#
# Surfaced by the "What's New" toolbar button (docs/dev/414th-features.md §92).
# The window shows the first `limit` entries, so the file is authored newest-first
# and the oldest rows simply fall off the bottom of the window.
#
# Add an entry when a player-visible change lands. `watch` is the point of the
# file and the reason it is not just the changelog: it says what to actually look
# for in the next mission. `row` links the in-game-pass checklist row that owns
# the verdict, when one exists.
#
# Entries are re-sorted by date on load, and the sort is stable, so several
# changes sharing a date keep the order written here.

entries:
  - date: 2026-08-23
    title: The front line sits on ground the armour can hold
    change: >-
      Where the supply route crossed the edge of ground vehicles cannot drive,
      the front line was drawn entirely onto the impassable side and none of it
      onto the passable side. On a Caucasus mountain crossing that put the whole
      20 km front on a ridge, and left blue and red bunched 15 km apart on
      opposite edges of it instead of facing each other. The front is now
      measured against the ground that is actually drivable. A front pinched
      into a pass is legitimately narrower than the width setting asks for.
      Caucasus - Northern Russia also had the supply line that caused it: its
      Kutaisi-Khashuri road crossed the Likhi range in one 41 km straight leg,
      and now follows the E60 through the Rikoti pass. That half needs a new
      game.
    watch: >-
      Look at the orange front line on the campaign map where it meets a
      mountain or a coast. It should run into passable ground alongside the
      supply route rather than off into terrain. In the mission, the two sides'
      ground groups should face each other across the front instead of sitting
      in two separate blobs.
    row: B93
  - date: 2026-08-22
    title: The Tomcat's JDAM page hands each bomb its own target
    change: >-
      The F-14B(U) cartridge reads which tunnel stations actually carry a JDAM
      and gives each one a different target as PP1, in route order, wrapping
      when there are more bombs than targets. Every target stays on every
      station for a re-pick. All targets in a cluster now run in from the IP;
      the second building used to measure its heading, speed and release
      altitude from the first. The release speed behind the LAR is the slower
      of the plan and 450 kt, so the envelope the CDNU draws is the
      conservative one. The first target waypoint is named with the jet's XST
      code, which puts a pentagon on it in the HUD; the rest of a cluster go to
      the LANTIRN store, the top-ranked SAM site becomes the hostile area that
      sets the threat axis, and a CAP's defended point sits on the asset it
      covers. Points that would share a name are numbered, and the recovery
      and divert points are named after their fields.
    watch: >-
      Load a multi-building strike with two or more JDAMs on the tunnel
      stations. On the JDAM page, STA 3 PP1 should be the first building and
      the next loaded station's PP1 the second, both with the same run-in
      heading and 20,000-ft-class release altitude.
    row: B91
  - date: 2026-08-22
    title: Operation Forager, the first Marianas 1944 campaign
    change: >-
      A campaign on the new Marianas WWII terrain. Blue holds the Charan Kanoa
      beach strip on Saipan and a carrier; red holds the other nine fields
      across Saipan, Tinian, Rota and Guam. The islands connect to each other
      only by sea. Corsairs fly from the Essex and Thunderbolts from the beach
      strip, against Japanese flak batteries built from Japanese guns.
    watch: >-
      Start it and look at the map. One blue field, one front line running
      north from the beachhead to Aslito, and no road off Saipan. Then check
      that your Corsair squadron is aboard the carrier and the Thunderbolts
      are ashore.
  - date: 2026-08-22
    title: The Package Targets Map shows real terrain
    change: >-
      The page behind the packages list drew land as a flat tan fill with a
      coastline. It now draws the shipped theater imagery where that imagery
      covers the area, so you can see the ground the packages are headed for.
      Where it does not reach — a spread that runs off the picture, or Cyprus,
      which the Syria image never drew — the page falls back to the old
      coastline fill rather than stretching imagery over ground it cannot
      place. The same fix repaired the offline recon pages, whose imagery had
      been misplaced by up to a few hundred km.
    watch: >-
      Open the Package Targets Map on a Syria or Caucasus turn. Coastal fields
      should sit on the imaged shoreline, not near it. A turn whose packages
      span the whole theater will still show the plain fill — that is the page
      refusing to guess, not a failure. The packages may also sit slightly
      off-centre, which is the page shifting to stay on the imagery.
    row: H15
  - date: 2026-08-22
    title: A sunk carrier takes its squadrons down with it
    change: >-
      Sinking a carrier grounded the squadrons based on it only when the hull
      was classed as an aircraft carrier. The LHAs and the WWII Essex are
      classed as helicopter carriers, so putting one on the bottom left its
      air wing flying from a ship that no longer existed. A second fault hit
      the supercarriers too: the squadrons were removed while the list holding
      them was being walked, so where two squadrons shared an aircraft type
      the second one survived.
    watch: >-
      Sink a carrier or an LHA and pass the turn. Every squadron that was
      based on it should be gone from the air wing, not just the first of each
      type.

  - date: 2026-08-22
    title: Steerpoint elevations stop reading 0
    change: >-
      Every cartridge steerpoint but the landing point carried an elevation of
      0. They now carry the nearest airfield's elevation, the only height data
      the campaign has. An estimate, but closer than 0 everywhere and exact on a
      flat map. The ingress point also stops wearing the target symbol on the
      Viper's HSD and the Hornet's route.
    watch: >-
      On a Viper, check a target steerpoint's ELEV on the DED STPT page: the
      nearest field's height, not 0. Then slave the pod to it on high ground and
      see whether it lands on the target or short.
    row: B90
  - date: 2026-08-22
    title: The cartridge shows your own orbit, and the Viper gets the enemy field
    change: >-
      The Hornet's SA page and the Viper's extra steerpoints used to carry every
      friendly CAP station in the ATO. They now carry your own orbit first — your
      patrol track, or your hold point when you fly no track — then the tankers
      and AWACS, and nothing else. The Viper's DEST page adds the enemy airfield
      you are working over, right after the briefed divert. The F-14B(U) gets a
      cartridge of its own: plan 1 references, the route on plan 2, pre-planned
      JDAM points and the package in the TIS list. Super Hornets no longer take
      one, and the Viper's cartridge drops its comm section: in both cases the
      data already reaches the jet through the mission itself.
    watch: >-
      Strike Hornet: CAP point 1 should be on your hold and selected at spawn.
      Viper on an airfield strike: DEST 82 should be the target field.
    row: B28
  - date: 2026-08-20
    title: Steerpoint elevations stop reading as cruise altitude
    change: >-
      The Hornet and Viper cartridges carry two altitudes per steerpoint — the
      ground under it, and the height you fly the leg at — and we were writing
      the same number into both. An en-route point told the jet the ground under
      it was at 18,000 ft. Landing points now carry their field's elevation, and
      the route altitude is unchanged.
    watch: >-
      On a regenerated mission, check an en-route steerpoint's elevation on the
      DED or the HSI: ground level, not your cruise altitude. A target steerpoint
      still reads zero — that half is not fixed.
    row: B90
  - date: 2026-08-20
    title: Hornet and Viper cards carry both clocks
    change: >-
      Those cockpits read Zulu, so their kneeboards now print the Zulu time
      beside the local one — on the flight plan, the BLUF TOT, the package
      list and the tanker and AWACS lines. Before this only the BLUF TOT was
      converted, so one card showed two clocks a map offset apart. The local
      figure stays, so a mixed package still coordinates off one number.
    watch: >-
      On a Hornet or Viper, check the flight-plan Takeoff row before you roll:
      "17:28L 14:28Z", with the Zulu figure matching the DED or HUD clock. An
      A-10 or Strike Eagle card is unchanged.
    row: B28
  - date: 2026-08-20
    title: Point the air war where you want it
    change: >-
      Every enemy base dialog gains a planning-priority control (with the new
      Region priorities setting on): emphasized regions draw the auto-planner's
      offensive packages as if at half the distance, deprioritized ones as if at
      double, and an ignored region is left entirely to packages you build by
      hand. Rescues and your own packages are never affected, and the enemy
      planner cannot read it.
    watch: >-
      Turn the setting on, mark a far enemy base Emphasized and a near one
      Ignored, and regenerate the turn. The ATO should lean toward the far base
      and auto-plan nothing at the ignored one.
    row: B89
  - date: 2026-08-19
    title: The app stops freezing when DCS takes the GPU
    change: >-
      Qt moved from 6.4 to 6.8, which draws the embedded map through Direct3D 11
      instead of desktop OpenGL. The old path could deadlock inside the graphics
      driver while a fullscreen DCS held the card.
    watch: >-
      Open Retribution, then launch DCS. The app should stay responsive, and a
      dialog opened over the map should no longer hang it.
    pr: "905"

  - date: 2026-08-19
    title: Warships stop emptying every anti-ship tube in one mission
    change: >-
      A ship group now holds fire after a set number of anti-ship missiles per
      mission (default 6) and stays quiet for the rest of the day. Its campaign
      magazine is unchanged, and a group under attack still shoots back.
    watch: >-
      Red's cruiser should fire a salvo and go silent instead of ripple-firing its
      whole loadout in half a minute. The log says "salvo complete (6 this
      mission)".
    row: B39
    pr: "906"

  - date: 2026-08-19
    title: Carrier Strike Group 8 sails a cruiser screen
    change: >-
      Three Ticonderogas and one Arleigh Burke, instead of four Burkes and one
      Ticonderoga. Only that one named US layout changed; the mixed carrier and
      LHA screens, and every other navy, generate as before.
    watch: >-
      On a turn that rolls the CSG-8 layout, count the escorts ringing the
      carrier.
    pr: "906"

  - date: 2026-08-19
    title: A dead comms or power node keeps degrading its SAMs
    change: >-
      The IADS dropped any node whose units were all dead, so from the turn after
      you killed it the dependency vanished and the SAMs it fed went back to full
      capability.
    watch: >-
      Kill a comms or power node, pass the turn, and the SAMs behind it should
      still be degraded in the next mission rather than fighting fresh.
    pr: "904"

  - date: 2026-08-19
    title: ATMOS-X live weather — the turn flies a real observation
    change: >-
      With the ATMOS-X cloud pack selected, "Use ATMOS-X live weather" replaces the
      generated weather with a real one. The turn display, the kneeboard QNH and
      winds, the active runway and the carrier's course into wind all read it.
    watch: >-
      Turn it on and check the kneeboard QNH and winds match the turn display.
      Any fetch failure should log and leave the generated weather in place.
    row: B83
    pr: "902"

  - date: 2026-08-18
    title: The AWACS orbits at a field it can actually fly from
    change: >-
      The orbit is anchored on a field that actually hosts an AWACS, whether or not
      that field is near the front.
    watch: >-
      Check the AEW&C racetrack sits within reach of a field with the aircraft on
      it, rather than over an empty forward strip.
    row: B82
    pr: "899"

  - date: 2026-08-18
    title: An un-engaged site stops leaking its condition on the map
    change: >-
      Every enemy air-defence site you had not engaged was drawing a green "fully
      capable" bar, a regression from removing the BDA lag. The symbol hides
      condition again until you earn it.
    watch: >-
      With "Reveal fog of war" off, an enemy site you have never touched should
      carry no condition bar at all.
    row: G39
    pr: "898"

  - date: 2026-08-18
    title: Engaging a site reveals it completely; recon no longer does
    change: >-
      A site is revealed by putting ordnance on it, or by any ground-attack sortie
      that reaches it, and is then known permanently, damage included. Recon's one
      job is finding the hidden enemy command posts.
    watch: >-
      Strike a site and its composition and damage should be fully readable
      afterwards. Fly recon over a site nobody has engaged and it should stay
      hidden.
    row: G39
    pr: "890"

  - date: 2026-08-18
    title: Automatic fire missions stop naming targets you cannot see
    change: >-
      Auto cruise-missile raids and the long-range carrier strike both picked from
      ground truth with no fog gate, so the first raid of a campaign could go
      straight at a command post you had not found, and reveal it permanently.
    watch: >-
      With the fog on, an automatic raid should never name a site that is absent
      from your own map.
    row: G40
    pr: "893"

  - date: 2026-08-18
    title: DTC cartridge push times are Zulu, not the mission clock
    change: >-
      The cartridge wrote mission-local times where the jet's avionics run Zulu, so
      the steerpoint times disagreed with the DED and HUD by the map's offset.
    watch: >-
      Load a cartridge and compare a steerpoint's time of arrival against System
      Time on the DED or HUD. They should agree.
    row: B28
    pr: "895"
